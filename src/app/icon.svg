<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Contenedor con gradiente redondeado idéntico al logo de la app -->
  <rect width="512" height="512" rx="128" fill="url(#logoGrad)" />
  
  <!-- Huella / Paw print en blanco -->
  <g fill="#ffffff" filter="url(#subtleShadow)">
    <!-- Almohadilla principal -->
    <path d="M256 220 C205 220 162 254 162 312 C162 362 204 402 256 402 C308 402 350 362 350 312 C350 254 307 220 256 220 Z" />
    <!-- 4 Dedos / Toes -->
    <ellipse cx="158" cy="180" rx="35" ry="48" transform="rotate(-22 158 180)" />
    <ellipse cx="225" cy="140" rx="33" ry="46" transform="rotate(-7 225 140)" />
    <ellipse cx="287" cy="140" rx="33" ry="46" transform="rotate(7 287 140)" />
    <ellipse cx="354" cy="180" rx="35" ry="48" transform="rotate(22 354 180)" />
  </g>
</svg>
